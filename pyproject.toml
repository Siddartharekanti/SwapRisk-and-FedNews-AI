[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interest-rate-swap-risk-optimizer"
version = "1.0.0"
description = "Interest-Rate-Swap-Risk-Optimizer: Quantitative Swap Risk Engine & Automated Hedge Optimizer"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2", "joblib>=1.3,<2", "requests>=2.31,<3",
  "streamlit>=1.32,<2", "plotly>=5.18,<7"
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]
transformer = ["torch>=2.1,<3", "transformers>=4.40,<5"]

[project.scripts]
swap-risk-optimizer = "swapscribe.cli:main"
yieldpulse = "swapscribe.cli:main"
swapscribe = "swapscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
